<!doctype html><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#0b0507;overflow:hidden}canvas{width:100%;height:100%;display:block}</style>
<canvas id="c"></canvas><script>
// Embers: warm sparks rising and fading over a dark gradient, 30 frames per second.
const c=document.getElementById('c'),x=c.getContext('2d');function fit(){c.width=innerWidth;c.height=innerHeight}fit();addEventListener('resize',fit);
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const mk=(init)=>({x:rnd(),y:init?rnd():1.05,v:.015+rnd()*.05,r:.8+rnd()*2.2,p:rnd()*6,h:12+rnd()*28});
const sp=Array.from({length:120},()=>mk(true));let last=0;
function frame(t){requestAnimationFrame(frame);if(t-last<33)return;const dt=(t-last)/1000;last=t;
const g=x.createLinearGradient(0,0,0,c.height);g.addColorStop(0,'#0b0507');g.addColorStop(1,'#2a0e0a');x.fillStyle=g;x.fillRect(0,0,c.width,c.height);
x.globalCompositeOperation='lighter';
for(let i=0;i<sp.length;i++){const s=sp[i];s.y-=dt*s.v;s.x+=Math.sin(t*.0008+s.p)*dt*.01;if(s.y<-.05)sp[i]=mk(false);const a=Math.max(0,Math.min(1,s.y*1.1));
const px=s.x*c.width,py=s.y*c.height,rr=s.r*3;const rg=x.createRadialGradient(px,py,0,px,py,rr);rg.addColorStop(0,'hsla('+s.h+',100%,60%,'+(a*.9).toFixed(2)+')');rg.addColorStop(1,'hsla('+s.h+',100%,50%,0)');x.fillStyle=rg;x.fillRect(px-rr,py-rr,rr*2,rr*2)}
x.globalCompositeOperation='source-over';}
requestAnimationFrame(frame);</script>
