function makeFrame(id, mode, sandbox, cspMeta) {
  const cfg = { id, mode, port: P };
  const f = document.createElement('iframe');
  f.setAttribute('sandbox', sandbox);
  f.style.cssText = 'width:200px;height:60px;border:1px solid #888';
  f.srcdoc = '<!doctype html><html><head>' + cspMeta + '</head><body><script>(' + hostileWidget.toString() + ')(' + JSON.stringify(cfg) + ')<\/script></body></html>';
  document.body.appendChild(f);
  return f;
}

const waits = {};
window.addEventListener('message', (e) => {
  send({ kind: 'widget-result', origin: e.origin, data: e.data });
  const w = waits[e.data && e.data.id]; if (w) { w(); delete waits[e.data.id]; }
});
const waitFor = (id, ms) => new Promise((res) => { waits[id] = res; setTimeout(res, ms); });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const DELIVERY = '__DELIVERY__';
async function runProtocol() {
  await sleep(500);
  send({ kind: 'MEASURE', label: 'host only, no widgets' });
  const mk = (id, mode, scheme) => {
    const f = document.createElement('iframe');
    // allow-same-origin: each widget gets its REAL origin (http://pwX.localhost), isolated by origin, not opaque.
    f.setAttribute('sandbox', 'allow-scripts allow-same-origin');
    f.style.cssText = 'width:160px;height:50px';
    f.src = 'http://' + scheme + '.localhost/?id=' + encodeURIComponent(id) + '&mode=' + mode + '&port=' + P;
    document.body.appendChild(f); return f;
  };
  let f = mk('P1-protocol+CSP-header', 'attack', 'pwa');
  await waitFor('P1-protocol+CSP-header', 12000); await sleep(1500); f.remove();
  f = mk('P2-selfnav', 'selfnav', 'pwa');
  await waitFor('P2-selfnav', 3000); await sleep(2000); f.remove();
  let maxGap = 0, last = performance.now();

  const victim = mk('P3-victim-heartbeat', 'hb', 'pwb');
  const bystander = mk('P3-bystander-heartbeat', 'hb', 'pwc');

  const hog = mk('P3-hog', 'starve', 'pwa');

  send({ kind: 'starvation', host_timer_max_gap_ms: Math.round(maxGap), expected_gap_ms: 50, busy_loop_ms: 3000 });
  send({ kind: 'MEASURE', label: '3 widgets on 3 origins (after hog)' });
  victim.remove(); bystander.remove(); hog.remove();
  send({ kind: 'ALLDONE' });
}
(async () => {

  await sleep(500);
