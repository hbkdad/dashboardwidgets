<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:transparent;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:#fff;overflow:hidden}
html[data-ink=dark] body{color:#10131c}
.w{padding:16px 20px;display:grid;gap:12px}
.r{display:grid;gap:6px}.l{display:flex;justify-content:space-between;font-size:13px;opacity:.85}
.b{height:7px;border-radius:4px;background:rgba(127,127,127,.35);overflow:hidden}.b i{display:block;height:100%;width:0;background:var(--accent,#7cf2c8);transition:width .6s cubic-bezier(.16,1,.3,1)}
.hint{font-size:12px;opacity:.7}
</style></head><body><div class="w">
<div class="r"><div class="l"><b>CPU</b><span id="cv">--</span></div><div class="b"><i id="cb"></i></div></div>
<div class="r"><div class="l"><b>Memory</b><span id="rv">--</span></div><div class="b"><i id="rb"></i></div></div>
<div class="hint" id="h"></div></div>
<script src="/__plinth/sdk.js"></script><script src="/main.js"></script></body></html>
