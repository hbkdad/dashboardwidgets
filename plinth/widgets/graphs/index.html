<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:transparent;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:#fff;overflow:hidden}
html[data-ink=dark] body{color:#10131c}
.w{height:100%;box-sizing:border-box;padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px 14px}
.g{display:grid;grid-template-rows:auto 1fr;min-height:0}
.t{display:flex;justify-content:space-between;font-size:12px;opacity:.9}.t b{font-weight:600}.t span{opacity:.75}
canvas{width:100%;height:100%;min-height:0;display:block;border-radius:8px;background:rgba(127,127,127,.12)}
.hint{position:absolute;left:14px;bottom:6px;font-size:11px;opacity:.65}
</style></head><body><div class="w">
<div class="g"><div class="t"><b>CPU</b><span id="v0">--</span></div><canvas id="c0"></canvas></div>
<div class="g"><div class="t"><b>GPU</b><span id="v1">--</span></div><canvas id="c1"></canvas></div>
<div class="g"><div class="t"><b>Memory</b><span id="v2">--</span></div><canvas id="c2"></canvas></div>
<div class="g"><div class="t"><b>Network</b><span id="v3">--</span></div><canvas id="c3"></canvas></div>
</div><div class="hint" id="h"></div>
<script src="/__plinth/sdk.js"></script><script src="main.js"></script></body></html>
