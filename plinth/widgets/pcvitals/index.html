<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:transparent;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:#fff;overflow:hidden}
html[data-ink=dark] body{color:#10131c}
.w{height:100%;box-sizing:border-box;padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;align-content:start}
.ring{display:flex;gap:12px;align-items:center}
.dial{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent,#7cf2c8) calc(var(--p)*1%),rgba(127,127,127,.28) 0);display:grid;place-items:center;transition:background .6s}
.dial::before{content:"";width:48px;height:48px;border-radius:50%;background:rgba(18,20,28,.72);grid-area:1/1}
html[data-ink=dark] .dial::before{background:rgba(255,255,255,.7)}
.dial b{grid-area:1/1;z-index:1;font:600 15px "Segoe UI Variable Display","Segoe UI",sans-serif}
.meta small{display:block;opacity:.7;font-size:12px}.meta strong{font-size:14px;font-weight:600}
.row{display:grid;gap:5px}.l{display:flex;justify-content:space-between;font-size:12px;opacity:.85}
.bar{height:6px;border-radius:3px;background:rgba(127,127,127,.3);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent,#7cf2c8);transition:width .6s cubic-bezier(.16,1,.3,1)}
.full{grid-column:1/3}
.hint{font-size:11.5px;opacity:.65}
</style></head><body><div class="w">
<div class="ring"><div class="dial" id="cd"><b id="cp">--</b></div><div class="meta"><strong>CPU</strong><small id="cm">&nbsp;</small></div></div>
<div class="ring"><div class="dial" id="gd"><b id="gp">--</b></div><div class="meta"><strong id="gn">GPU</strong><small id="gm">&nbsp;</small></div></div>
<div class="row"><div class="l"><span>Memory</span><span id="rv">--</span></div><div class="bar"><i id="rb"></i></div></div>
<div class="row"><div class="l"><span>Video memory</span><span id="vv">--</span></div><div class="bar"><i id="vb"></i></div></div>
<div class="row"><div class="l"><span>Network</span><span id="nv">--</span></div></div>
<div class="row"><div class="l"><span>Disk</span><span id="dv">--</span></div><div class="bar"><i id="db"></i></div></div>
<div class="hint full" id="h"></div>
</div>
<script src="/__plinth/sdk.js"></script><script src="main.js"></script></body></html>
