<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="frame-src http://pw0.localhost http://pw1.localhost http://pw2.localhost http://pw3.localhost http://pw4.localhost http://pw5.localhost http://pw6.localhost http://pw7.localhost; default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
.wall{position:fixed;inset:-4%;background:__WALL__;animation:drift 40s ease-in-out infinite alternate}
.mid{position:fixed;inset:0;background:__MID__;mix-blend-mode:screen}
.grain{position:fixed;inset:0;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
@keyframes drift{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.06) translate(-1.2%,-1%)}}
@media (prefers-reduced-motion:reduce){.wall{animation:none}}
.slot{position:fixed;border-radius:22px;overflow:hidden;background:__GLASS__;backdrop-filter:blur(22px) saturate(1.35);border:1px solid rgba(255,255,255,.16);box-shadow:0 20px 60px rgba(0,0,0,.30)}
.slot iframe{width:100%;height:100%;border:0;background:transparent;color-scheme:normal}
</style></head>
<body><div class="wall"></div><div class="mid"></div><div class="grain"></div><div id="slots"></div>__BANNER____BEACON__
<script>
// Trusted layer page. A message's identity is the iframe it came from, never anything inside the message.
const widgets = __WIDGETS__;
const LAYOUT = {
  'com.plinth.clock':  { left: '5%',  top: '9%',     width: 360, height: 118 },
  'com.plinth.sysmon': { right: '5%', top: '9%',     width: 310, height: 150 },
  'com.plinth.notes':  { left: '5%',  bottom: '15%', width: 330, height: 200 },
};
const frames = {};
let stack = 0;
for (const w of widgets) {
  const pos = LAYOUT[w.id] || { left: (5 + 22 * (stack++)) + '%', top: '55%', width: 300, height: 160 };
  const d = document.createElement('div');
  d.className = 'slot';
  for (const [k, v] of Object.entries(pos)) d.style[k] = typeof v === 'number' ? v + 'px' : v;
  const f = document.createElement('iframe');
  f.setAttribute('sandbox', 'allow-scripts allow-same-origin');
  f.title = w.id;
  f.src = 'http://pw' + w.slot + '.localhost/?ink=__INK__&accent=__ACCENT__';
  d.appendChild(f);
  document.getElementById('slots').appendChild(d);
  frames[w.slot] = f;
}
addEventListener('message', (e) => {
  for (const [slot, f] of Object.entries(frames)) {
    if (f.contentWindow === e.source) {
      let msg; try { msg = JSON.stringify(e.data); } catch (_) { msg = 'null'; }
      window.ipc.postMessage(JSON.stringify({ slot: Number(slot), msg }));
      return;
    }
  }
});
window.__deliver = (slot, resp) => { const f = frames[slot]; if (f) f.contentWindow.postMessage(resp, 'http://pw' + slot + '.localhost'); };
</script></body></html>
