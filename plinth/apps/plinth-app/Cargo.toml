[package]
name = "plinth-app"
description = "Plinth desktop app: hub window, desktop layer with isolated widgets, permission broker, network proxy. Windows."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
plinth-core = { path = "../../crates/plinth-core" }
plinth-host = { path = "../../crates/plinth-host" }
plinth-proxy = { path = "../../crates/plinth-proxy" }
serde_json = "1"
wry = "0.57.1"
tao = "0.37.2"
tray-icon = "0.26.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
sha2 = "0.10"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
