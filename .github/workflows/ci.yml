name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plinth
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plinth
      - name: Unit tests (core, host, proxy)
        run: cargo test -p plinth-core -p plinth-host -p plinth-proxy
      - name: Build all crates (spikes compile)
        run: cargo build --workspace
